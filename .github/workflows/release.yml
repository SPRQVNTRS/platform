name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  packages: write
  # Trusted Publishing (OIDC) for npmjs.com — no stored npm token.
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          # We cache the pnpm store ourselves below; pnpm isn't installed yet at this step.
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.1

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v5
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version packages
        run: |
          # Check for pending changesets (any .md file that isn't README)
          CHANGESETS=$(find .changeset -name '*.md' ! -name 'README.md' 2>/dev/null)
          if [ -n "$CHANGESETS" ]; then
            echo "::notice::Pending changesets found, versioning packages..."
            pnpm version-packages
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore: version packages [skip ci]"
            git push
          else
            echo "::notice::No pending changesets"
          fi

      # PACKAGES_TOKEN: operator PAT with write:packages; the packages are linked to the legacy repo so the job token cannot write them. Replace with a fine-grained PAT when convenient.
      - name: Publish packages to GitHub Packages
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      # npm Trusted Publishing needs npm CLI >= 11.5.1 to exchange the run's
      # OIDC token for a short-lived publish credential.
      - name: Upgrade npm for Trusted Publishing
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          npm install -g npm@latest
          npm --version

      # Second registry, different auth model: NO NODE_AUTH_TOKEN here — the
      # publish authenticates via OIDC. Both the runner .npmrc (written by
      # setup-node's registry-url) and the repo .npmrc map @sprqvntrs to
      # GitHub Packages, and a bare --registry does NOT beat a scoped mapping,
      # so the scope is overridden explicitly on the command line.
      - name: Publish packages to npmjs.com
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          NPMJS=https://registry.npmjs.org
          for dir in packages/llm packages/workflows packages/helpers packages/logger packages/bot-verify; do
            NAME=$(node -p "require('./$dir/package.json').name")
            VERSION=$(node -p "require('./$dir/package.json').version")
            if npm view "$NAME@$VERSION" version --registry "$NPMJS" >/dev/null 2>&1; then
              echo "::notice::$NAME@$VERSION already on npmjs.com, skipping"
              continue
            fi
            echo "::notice::Publishing $NAME@$VERSION to npmjs.com"
            ( cd "$dir" && npm publish \
                --provenance \
                --access public \
                --registry "$NPMJS" \
                --@sprqvntrs:registry="$NPMJS" )
          done

  docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check for image changes
        id: changes
        run: |
          # Check if any images/* files changed in this push
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")

          if echo "$CHANGED_FILES" | grep -q "^images/postgres/"; then
            echo "postgres_changed=true" >> $GITHUB_OUTPUT
          else
            echo "postgres_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Get postgres version
        id: postgres-version
        if: steps.changes.outputs.postgres_changed == 'true'
        run: |
          VERSION=$(node -p "require('./images/postgres/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # PACKAGES_TOKEN: operator PAT with write:packages; the packages are linked to the legacy repo so the job token cannot write them. Replace with a fine-grained PAT when convenient.
      - name: Log in to GitHub Container Registry
        if: steps.changes.outputs.postgres_changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGES_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.changes.outputs.postgres_changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push postgres image
        if: steps.changes.outputs.postgres_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./images/postgres
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/sprqvntrs/postgres:${{ steps.postgres-version.outputs.version }}
            ghcr.io/sprqvntrs/postgres:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
