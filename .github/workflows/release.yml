name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          # We cache the pnpm store ourselves below; pnpm isn't installed yet at this step.
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.1

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v5
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version packages
        run: |
          # Check for pending changesets (any .md file that isn't README)
          CHANGESETS=$(find .changeset -name '*.md' ! -name 'README.md' 2>/dev/null)
          if [ -n "$CHANGESETS" ]; then
            echo "::notice::Pending changesets found, versioning packages..."
            pnpm version-packages
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore: version packages [skip ci]"
            git push
          else
            echo "::notice::No pending changesets"
          fi

      - name: Publish packages
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check for image changes
        id: changes
        run: |
          # Check if any images/* files changed in this push
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")

          if echo "$CHANGED_FILES" | grep -q "^images/postgres/"; then
            echo "postgres_changed=true" >> $GITHUB_OUTPUT
          else
            echo "postgres_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Get postgres version
        id: postgres-version
        if: steps.changes.outputs.postgres_changed == 'true'
        run: |
          VERSION=$(node -p "require('./images/postgres/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        if: steps.changes.outputs.postgres_changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.changes.outputs.postgres_changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push postgres image
        if: steps.changes.outputs.postgres_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./images/postgres
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/sprqvntrs/postgres:${{ steps.postgres-version.outputs.version }}
            ghcr.io/sprqvntrs/postgres:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
