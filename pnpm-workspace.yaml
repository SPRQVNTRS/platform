packages:
  - packages/*
  - images/*

onlyBuiltDependencies:
  - esbuild

# Same-major floors for transitive Dependabot alerts (2026-11-05).
# Each key matches only the vulnerable versions; the value stays in that major.
# vite is not here: it is an auto-installed peer of vitest, which overrides do
# not reach, so the root package.json pins it as a devDependency instead.
overrides:
  js-yaml@<3.15.2: ^3.15.2
  postcss@<8.5.23: ^8.5.23
  fast-copy@<4.1.0: ^4.1.0
  nanoid@<3.3.12: ^3.3.12
  picomatch@<2.3.2: ^2.3.2
  source-map-js@<1.2.2: ^1.2.2
  zod@<4.6.6: ^4.6.6
